name: Seed Supabase Scenarios

# Manual only. supabase/seed.sql is an idempotent upsert
# (`insert ... on conflict (slug) do update set ...`) scoped entirely to
# public.scenarios — it never touches call_sessions, credit_ledger,
# profiles, or auth.users, and running it twice cannot duplicate or lose
# rows. Verified locally: applying it against a fresh database and then
# applying it again a second time leaves the row count and contents
# unchanged (6 scenarios, matched by slug both times).
on:
  workflow_dispatch: {}

concurrency:
  group: supabase-seed-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  seed:
    name: Upsert scenario seed data
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link to the Supabase project
        run: |
          supabase link \
            --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}" \
            --password "${{ secrets.SUPABASE_DB_PASSWORD }}"

      # Runs ONLY supabase/seed.sql — no db reset, no other tables, no
      # migrations here (use supabase-deploy.yml for those).
      - name: Upsert scenarios from supabase/seed.sql
        run: |
          supabase db query \
            --linked \
            --password "${{ secrets.SUPABASE_DB_PASSWORD }}" \
            --file supabase/seed.sql
